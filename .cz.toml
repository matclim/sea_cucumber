[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version = "0.2.0"
update_changelog_on_bump = true
# Keep every place the version lives in sync on `cz bump`.
version_files = [
  "VERSION",
  "pixi.toml:^version",
  "CITATION.cff:^version",
]
